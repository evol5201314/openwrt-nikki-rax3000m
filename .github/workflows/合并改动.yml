name: 合并备份分支到 25.12

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 拉取备份分支 25.12.16
        run: |
          git fetch origin 25.12.16

      - name: 合并备份分支到 25.12
        run: |
          git checkout 25.12
          git merge origin/25.12.16 -X ours --allow-unrelated-histories -m "合并备份分支 25.12.16"

      - name: 推送合并结果
        run: |
          git push origin 25.12
