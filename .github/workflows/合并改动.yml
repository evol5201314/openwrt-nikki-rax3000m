name: 合并作者的更新到备份分支（保留你的自定义内容）

on:
  workflow_dispatch

permissions:
  contents: write

jobs:
  merge-custom:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: 配置 Git 用户
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 切换到你的备份分支（25.12.16）
        run: |
          git checkout 25.12.16

      - name: 拉取作者最新的 25.12
        run: |
          git fetch origin 25.12

      - name: 将作者的更新合并到你的备份分支（保留你的修改）
        run: |
          # -X ours 表示：冲突时保留你（25.12.16）的修改
          git merge origin/25.12 -X ours --allow-unrelated-histories -m "合并作者最新更新，保留自定义修改"

      - name: 将合并后的内容推送到 25.12
        run: |
          git push origin 25.12.16:25.12
