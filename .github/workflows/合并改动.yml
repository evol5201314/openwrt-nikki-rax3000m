name: 合并备份分支到 25.12

on:
  workflow_dispatch

permissions:
  contents: write

env:
  SOURCE_REPO: "evol5201314/openwrt-nikki-rax3000m"
  SOURCE_BRANCH: "25.12.16"
  TARGET_BRANCH: "25.12"

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: 检出目标分支（25.12）
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SOURCE_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.PAT_TOKEN }}  # 需要 PAT，因为涉及跨仓库
          fetch-depth: 0

      - name: 拉取备份分支（25.12.16）
        run: |
          git fetch origin ${{ env.SOURCE_BRANCH }}

      - name: 合并备份分支（保留你的修改）
        run: |
          git merge origin/${{ env.SOURCE_BRANCH }} -X ours --allow-unrelated-histories -m "合并备份分支 ${{ env.SOURCE_BRANCH }}"

      - name: 推送合并结果
        run: |
          git push origin ${{ env.TARGET_BRANCH }}
