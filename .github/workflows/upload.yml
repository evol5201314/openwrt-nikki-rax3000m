name: 上传固件到 WebDAV

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - name: 查看当前目录
        run: ls -la
        
      - name: 安装 curl
        run: sudo apt-get install -y curl
        
      - name: 上传所有文件到坚果云
        run: |
          curl -u "${{ secrets.WEBDAV_USERNAME }}:${{ secrets.WEBDAV_PASSWORD }}" \
          -T "bin/targets/mediatek/filogic/openwrt-mediatek-filogic-cmcc_rax3000m-256m-nand-squashfs-sysupgrade.bin" \
          "${{ secrets.WEBDAV_URL }}firmware/rax3000m.bin"
