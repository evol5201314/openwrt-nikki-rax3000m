name: 上传固件到 WebDAV

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: 下载编译好的固件
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: openwrt
          name: out
          path: ./firmware

      - name: 查看下载的文件
        run: ls -la ./firmware/

      - name: 上传到坚果云 WebDAV
        uses: sp-codes/github-webdav-upload@v1
        with:
          webdav-url: ${{ secrets.WEBDAV_URL }}
          webdav-username: ${{ secrets.WEBDAV_USERNAME }}
          webdav-password: ${{ secrets.WEBDAV_PASSWORD }}
          local-path: ./firmware/
          remote-path: /firmware
