name: 上传固件到 WebDAV

on:
  workflow_dispatch:

jobs:
  upload:
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: 下载编译好的固件
        uses: dawidd6/action-download-artifact@v6
        with:
          workflow: openwrt
          name: out
          path: ./firmware

      - name: 查看文件
        run: ls -la ./firmware/

      - name: 上传到坚果云
        run: |
          USER="${{ secrets.WEBDAV_USERNAME }}"
          PASS="${{ secrets.WEBDAV_PASSWORD }}"
          URL="${{ secrets.WEBDAV_URL }}"
          
          cd ./firmware
          for f in *; do
            echo "上传 $f..."
            curl -s -S -u "$USER:$PASS" -T "$f" "$URL/firmware/$f"
          done
