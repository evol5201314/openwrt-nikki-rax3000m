name: Convert PassWall2 to APK

on:
  workflow_dispatch:  # 手动触发

jobs:
  convert-passwall2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download converter script
        run: |
          curl -L -o openwrt-ipk2apk.py https://raw.githubusercontent.com/rychly/openwrt-ipk2apk/main/openwrt-ipk2apk.py
          chmod +x openwrt-ipk2apk.py

      # 自动获取 PassWall2 最新 IPK 链接并下载
      - name: Fetch latest PassWall2 IPK packages
        run: |
          set -e
          REPO="xiaorouji/openwrt-passwall2"
          
          # 获取最新 Release 的 tag 名称
          echo "正在获取最新 Release 信息..."
          LATEST_TAG=$(curl -s "https://api.github.com/repos/$REPO/releases/latest" | grep -oP '"tag_name": "\K(.*?)(?=")')
          if [ -z "$LATEST_TAG" ]; then
            echo "错误：无法获取最新的 Release 信息"
            exit 1
          fi
          echo "最新版本 Tag: $LATEST_TAG"
          
          # 获取该 Release 下的所有 assets（附件）的下载链接
          ASSETS_URL="https://api.github.com/repos/$REPO/releases/tags/$LATEST_TAG"
          echo "正在获取 IPK 文件列表..."
          curl -s "$ASSETS_URL" | grep -oP '"browser_download_url": "\K(.*?)(?=")' > ipk_urls.txt
          
          mkdir -p passwall2_ipks
          
          # 定义需要下载的包名
          declare -A PKG_NAMES=(
            ["luci-app-passwall2"]="luci-app-passwall2"
            ["luci-i18n-passwall2"]="luci-i18n-passwall2"
          )
          
          for pkg_key in "${!PKG_NAMES[@]}"; do
            pkg_name="${PKG_NAMES[$pkg_key]}"
            # 查找匹配的 IPK 下载链接（不区分架构，直接下载 all 架构的包）
            download_url=$(grep -E "${pkg_name}.*_all\.ipk" ipk_urls.txt | head -n1)
            if [ -z "$download_url" ]; then
              echo "警告：未找到 ${pkg_key} 的 IPK 文件（_all.ipk），尝试查找其他架构..."
              download_url=$(grep -E "${pkg_name}.*\.ipk" ipk_urls.txt | head -n1)
            fi
            
            if [ -z "$download_url" ]; then
              echo "错误：未找到 ${pkg_key} 的 IPK 文件"
              exit 1
            fi
            
            echo "下载 $pkg_key -> $download_url"
            curl -L -o "passwall2_ipks/${pkg_key}.ipk" "$download_url"
            
            # 验证下载的文件是否为有效的 gzip 压缩包
            if ! file "passwall2_ipks/${pkg_key}.ipk" | grep -q "gzip compressed data"; then
              echo "错误：下载的文件无效（不是 gzip 格式），请检查链接"
              exit 1
            fi
            echo "✓ $pkg_key 下载并验证通过"
          done

      # 转换所有 IPK 为 APK
      - name: Convert IPKs to APKs
        run: |
          mkdir -p apk_output
          
          # 转换 passwall2_ipks 中的文件
          for ipk in passwall2_ipks/*.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在转换: $ipk"
              ./openwrt-ipk2apk.py "$ipk"
              # 移动生成的 APK（脚本会在同目录生成 .apk）
              base="${ipk%.ipk}"
              if [ -f "${base}.apk" ]; then
                mv "${base}.apk" apk_output/
              else
                echo "警告：未生成 APK 文件，请检查转换日志"
              fi
            fi
          done

      # 上传生成的 APK
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: passwall2-apk-packages
          path: apk_output/*.apk
          if-no-files-found: error

      # 打包为 ZIP
      - name: Create ZIP archive
        run: zip -r passwall2-apk-archive.zip apk_output/

      - name: Upload ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: passwall2-apk-archive
          path: passwall2-apk-archive.zip
