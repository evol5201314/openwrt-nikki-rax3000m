# 此工作流用于从 v2rayA 的官方软件源自动下载并转换其 OpenWrt IPK 包为 APK 格式
name: Convert v2rayA IPK to APK

on:
  workflow_dispatch:  # 支持手动触发
    inputs:
      custom_ipk_url:
        description: '自定义 IPK 文件的 URL（可选）'
        required: false
        type: string

permissions:
  contents: write  # 允许工作流推送转换后的 APK 文件到仓库

jobs:
  convert-v2raya:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download converter script
        run: |
          # 下载 IPK 转 APK 的转换脚本
          curl -L -o openwrt-ipk2apk.py https://raw.githubusercontent.com/rychly/openwrt-ipk2apk/main/openwrt-ipk2apk.py
          chmod +x openwrt-ipk2apk.py

      # --- 主要修改：从 v2rayA 官方源获取最新 IPK 包 ---
      - name: Fetch latest v2rayA IPK packages
        run: |
          set -e
          # 定义 v2rayA 官方软件包的源地址 (SourceForge)
          BASE_URL="https://downloads.sourceforge.net/project/v2raya/openwrt/aarch64_generic/"
          
          # 定义需要下载的包名及其文件名前缀
          declare -A PKG_PREFIXES=(
            ["v2raya"]="v2raya_"
            ["luci-app-v2raya"]="luci-app-v2raya_"
            ["luci-i18n-v2raya-zh-cn"]="luci-i18n-v2raya-zh-cn_"
            ["xray-core"]="xray-core_"  # v2rayA 官方推荐的核心，提供更好的 tproxy 支持
          )
          
          mkdir -p v2raya_ipks
          
          # 获取源站的目录列表
          echo "正在获取官方源文件列表..."
          # 使用 --list-only 参数获取 SourceForge 的目录列表，并提取 .ipk 文件名
          curl -s --list-only "${BASE_URL}" | grep -oE '[^"]+\.ipk' | sort -u > ipk_list.txt
          
          for pkg in "${!PKG_PREFIXES[@]}"; do
            prefix="${PKG_PREFIXES[$pkg]}"
            # 在列表中匹配并选择最新版本（按版本号排序，取最后一个）
            latest=$(grep "^${prefix}" ipk_list.txt | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              echo "错误：未找到匹配前缀 '$prefix' 的 IPK 文件"
              exit 1
            fi
            echo "下载 $pkg -> $latest"
            # 下载找到的最新 IPK 文件
            curl -L -o "v2raya_ipks/${pkg}.ipk" "${BASE_URL}${latest}"
            
            # 验证下载的文件是否为有效的 gzip 压缩包
            if ! file "v2raya_ipks/${pkg}.ipk" | grep -q "gzip compressed data"; then
              echo "错误：下载的文件无效（不是 gzip 格式），请检查链接：${BASE_URL}${latest}"
              exit 1
            fi
            echo "✓ $pkg 下载并验证通过"
          done
      # -------------------------------------------------

      # 可选：支持手动输入自定义 IPK URL
      - name: Download custom IPK from URL (if provided)
        if: github.event.inputs.custom_ipk_url != ''
        run: |
          mkdir -p custom_ipks
          curl -L -o custom_ipks/custom.ipk "${{ github.event.inputs.custom_ipk_url }}"
          if ! file "custom_ipks/custom.ipk" | grep -q "gzip compressed data"; then
            echo "警告：自定义 IPK 不是有效的 gzip 文件"
          fi

      # 转换所有 IPK 为 APK
      - name: Convert IPKs to APKs
        run: |
          mkdir -p apk_output
          
          # 转换 v2raya_ipks 中的文件
          for ipk in v2raya_ipks/*.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在转换: $ipk"
              ./openwrt-ipk2apk.py "$ipk"
              # 移动生成的 APK（脚本会在同目录生成 .apk）
              base="${ipk%.ipk}"
              if [ -f "${base}.apk" ]; then
                mv "${base}.apk" apk_output/
              else
                echo "警告：未生成 APK 文件，请检查转换日志"
              fi
            fi
          done
          
          # 转换自定义 IPK
          if [ -d "custom_ipks" ]; then
            for ipk in custom_ipks/*.ipk; do
              if [ -f "$ipk" ]; then
                echo "正在转换自定义: $ipk"
                ./openwrt-ipk2apk.py "$ipk"
                base="${ipk%.ipk}"
                if [ -f "${base}.apk" ]; then
                  mv "${base}.apk" apk_output/
                fi
              fi
            done
          fi

      # 将生成的 APK 复制到仓库根目录下的 apk/v2raya/ 文件夹
      - name: Prepare APK directory
        run: |
          mkdir -p apk/v2raya
          cp apk_output/*.apk apk/v2raya/

      # 提交并推送 APK 到当前分支的 /apk/v2raya 目录
      - name: Commit and push APKs to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apk/v2raya/
          
          if git diff --cached --quiet; then
            echo "没有检测到 APK 变更，跳过提交"
          else
            git commit -m "Update v2rayA APK packages from workflow run #${{ github.run_id }} [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
