name: Convert v2rayA IPK to APK (fixed URLs)

on:
  workflow_dispatch:
    inputs:
      custom_ipk_url:
        description: '自定义 IPK 文件的 URL（可选）'
        required: false
        type: string

permissions:
  contents: write

jobs:
  convert-v2raya:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download converter script
        run: |
          curl -L -o openwrt-ipk2apk.py https://raw.githubusercontent.com/rychly/openwrt-ipk2apk/main/openwrt-ipk2apk.py
          chmod +x openwrt-ipk2apk.py

      # 使用您提供的固定 URL 下载四个 IPK 包
      - name: Download v2rayA IPK packages from provided URLs
        run: |
          mkdir -p v2raya_ipks
          
          # 定义包名和对应的下载 URL（SourceForge 链接使用 ?format=raw 获取直接文件）
          declare -A PKG_URLS=(
            ["luci-app-v2raya"]="https://sourceforge.net/projects/v2raya/files/openwrt/aarch64_cortex-a53/luci-app-v2raya_12-r1_all.ipk/download?format=raw"
            ["v2raya"]="https://sourceforge.net/projects/v2raya/files/openwrt/aarch64_cortex-a53/v2raya_2.2.7.4-r1_aarch64_cortex-a53.ipk/download?format=raw"
            ["xray-core"]="https://sourceforge.net/projects/v2raya/files/openwrt/aarch64_cortex-a53/xray-core_25.10.15-r1_aarch64_cortex-a53.ipk/download?format=raw"
            ["ca-certificates"]="https://sourceforge.net/projects/v2raya/files/openwrt/aarch64_cortex-a53/ca-certificates_20250419-r1_all.ipk/download?format=raw"
          )
          
          for pkg in "${!PKG_URLS[@]}"; do
            url="${PKG_URLS[$pkg]}"
            echo "下载 $pkg 从 $url"
            curl -L -o "v2raya_ipks/${pkg}.ipk" "$url"
            
            # 验证下载的文件是否为有效的 gzip 压缩包
            if ! file "v2raya_ipks/${pkg}.ipk" | grep -q "gzip compressed data"; then
              echo "错误：下载的文件无效（不是 gzip 格式），请检查链接：$url"
              exit 1
            fi
            echo "✓ $pkg 下载并验证通过"
          done

      # 可选：支持手动输入自定义 IPK URL
      - name: Download custom IPK from URL (if provided)
        if: github.event.inputs.custom_ipk_url != ''
        run: |
          mkdir -p custom_ipks
          curl -L -o custom_ipks/custom.ipk "${{ github.event.inputs.custom_ipk_url }}"
          if ! file "custom_ipks/custom.ipk" | grep -q "gzip compressed data"; then
            echo "警告：自定义 IPK 不是有效的 gzip 文件"
          fi

      # 转换所有 IPK 为 APK
      - name: Convert IPKs to APKs
        run: |
          mkdir -p apk_output
          
          # 转换 v2raya_ipks 中的文件
          for ipk in v2raya_ipks/*.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在转换: $ipk"
              ./openwrt-ipk2apk.py "$ipk"
              base="${ipk%.ipk}"
              if [ -f "${base}.apk" ]; then
                mv "${base}.apk" apk_output/
              else
                echo "警告：未生成 APK 文件，请检查转换日志"
              fi
            fi
          done
          
          # 转换自定义 IPK
          if [ -d "custom_ipks" ]; then
            for ipk in custom_ipks/*.ipk; do
              if [ -f "$ipk" ]; then
                echo "正在转换自定义: $ipk"
                ./openwrt-ipk2apk.py "$ipk"
                base="${ipk%.ipk}"
                if [ -f "${base}.apk" ]; then
                  mv "${base}.apk" apk_output/
                fi
              fi
            done
          fi

      # 将生成的 APK 复制到仓库根目录下的 apk/v2raya/ 文件夹
      - name: Prepare APK directory
        run: |
          mkdir -p apk/v2raya
          cp apk_output/*.apk apk/v2raya/

      # 提交并推送 APK 到当前分支的 /apk/v2raya 目录
      - name: Commit and push APKs to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add apk/v2raya/
          
          if git diff --cached --quiet; then
            echo "没有检测到 APK 变更，跳过提交"
          else
            git commit -m "Update v2rayA APK packages from fixed URLs [skip ci]"
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi
