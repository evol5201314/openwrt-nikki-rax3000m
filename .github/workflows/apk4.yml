name: apk4

on:
  workflow_dispatch:

jobs:
  build-istore-apk:
    runs-on: ubuntu-22.04
    steps:
    - name: 安装编译依赖
      run: |
        sudo apt update
        sudo apt install -y build-essential git python3 unzip libssl-dev libncurses5-dev file wget

    - name: 克隆 OpenWrt 25.12 源码
      run: |
        git clone https://github.com/openwrt/openwrt.git
        cd openwrt
        # 切换到 25.12 分支（建议根据你设备上的固件版本，选择精确的 tag，如 v25.12.0）
        git checkout openwrt-25.12
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 添加 iStore Feed
      run: |
        cd openwrt
        echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: 配置编译选项
      run: |
        cd openwrt
        cat >> .config <<EOF
        CONFIG_TARGET_mediatek=y
        CONFIG_TARGET_mediatek_filogic=y
        CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y
        CONFIG_APK=y
        CONFIG_PACKAGE_luci-app-store=y
        EOF
        # 生成完整配置文件
        make defconfig

    - name: 下载软件包源码
      run: |
        cd openwrt
        make download -j8
        find dl -size -1024c -exec rm -f {} \;

    - name: 编译 iStore APK
      run: |
        cd openwrt
        # 编译 luci-app-store，如果失败则输出详细日志
        make package/feeds/istore/luci-app-store/compile -j1 V=s || { echo "=== Build Failed, check V=s output above ==="; exit 1; }

    - name: 收集 APK 文件
      run: |
        mkdir -p apks
        find openwrt/bin -name "*.apk" -exec cp {} apks/ \;
        cd apks
        tar -czvf istore-apk-for-25.12.tar.gz .
        echo "FILE=$GITHUB_WORKSPACE/istore-apk-for-25.12.tar.gz" >> $GITHUB_ENV

    - name: 上传编译好的 APK
      uses: actions/upload-artifact@v4
      with:
        name: istore-apk
        path: ${{ env.FILE }}
