name: Convert iStore to APK

on:
  workflow_dispatch:  # 手动触发，方便灵活使用

jobs:
  convert-istore:
    runs-on: ubuntu-latest

    steps:
      # 1. 拉取仓库代码（用于存放转换后的文件）
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 下载 openwrt-ipk2apk.py 转换脚本
      - name: Download converter script
        run: |
          curl -L -o openwrt-ipk2apk.py https://raw.githubusercontent.com/rychly/openwrt-ipk2apk/main/openwrt-ipk2apk.py
          chmod +x openwrt-ipk2apk.py

      # 3. 从官方源下载 iStore 的 4 个 IPK 包
      - name: Download iStore IPK packages
        run: |
          # 创建临时目录存放下载的 IPK 文件
          mkdir -p istore_ipks
          cd istore_ipks
          
          # 从官方仓库获取文件列表，下载最新的 IPK
          # 注意：请根据实际版本号更新这些 URL，或通过解析 index 获取最新版本
          # 以下是示例 URL 格式，实际使用时建议先访问 https://istore.linkease.com/repo/all/store/ 确认最新版本号
          echo "下载 taskd..."
          curl -L -o taskd.ipk "https://istore.linkease.com/repo/all/store/taskd_1.0.3-1_all.ipk" || echo "警告：taskd 下载失败，请检查版本号"
          
          echo "下载 luci-lib-taskd..."
          curl -L -o luci-lib-taskd.ipk "https://istore.linkease.com/repo/all/store/luci-lib-taskd_1.0.17_all.ipk" || echo "警告：luci-lib-taskd 下载失败"
          
          echo "下载 luci-lib-xterm..."
          curl -L -o luci-lib-xterm.ipk "https://istore.linkease.com/repo/all/store/luci-lib-xterm_4.18.0_all.ipk" || echo "警告：luci-lib-xterm 下载失败"
          
          echo "下载 luci-app-store（主程序）..."
          curl -L -o luci-app-store.ipk "https://istore.linkease.com/repo/all/store/luci-app-store_0.1.12-9_all.ipk" || echo "警告：luci-app-store 下载失败"
          
          cd ..

      # 4. 可选：支持手动指定 IPK URL
      - name: Download custom IPK from URL (if provided)
        if: github.event.inputs.custom_ipk_url != ''
        run: |
          mkdir -p custom_ipks
          cd custom_ipks
          curl -L -o custom.ipk "${{ github.event.inputs.custom_ipk_url }}"
          cd ..

      # 5. 转换所有 IPK 为 APK
      - name: Convert IPKs to APKs
        run: |
          # 创建输出目录
          mkdir -p apk_output
          
          # 转换 istore_ipks 目录中的所有 IPK 文件
          for ipk in istore_ipks/*.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在转换: $ipk"
              ./openwrt-ipk2apk.py "$ipk"
              # 移动生成的 APK 到输出目录
              mv "${ipk%.ipk}.apk" apk_output/ 2>/dev/null || true
            fi
          done
          
          # 如果有自定义 IPK，也进行转换
          if [ -d "custom_ipks" ]; then
            for ipk in custom_ipks/*.ipk; do
              if [ -f "$ipk" ]; then
                echo "正在转换自定义: $ipk"
                ./openwrt-ipk2apk.py "$ipk"
                mv "${ipk%.ipk}.apk" apk_output/ 2>/dev/null || true
              fi
            done
          fi

      # 6. 上传所有转换好的 APK 作为 Artifact
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: istore-apk-packages
          path: apk_output/*.apk
          if-no-files-found: warn

      # 7. 可选：将 APK 打包为 ZIP 文件并上传
      - name: Create and upload ZIP archive
        run: |
          zip -r istore-apk-archive.zip apk_output/
      - name: Upload ZIP archive
        uses: actions/upload-artifact@v4
        with:
          name: istore-apk-archive
          path: istore-apk-archive.zip
