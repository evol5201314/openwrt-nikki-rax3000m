name: Convert iStore to APK

on:
  workflow_dispatch:  # 手动触发
    inputs:
      custom_ipk_url:
        description: '自定义 IPK 文件的 URL（可选）'
        required: false
        type: string

permissions:
  contents: write  # 允许推送代码到仓库

jobs:
  convert-istore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download converter script
        run: |
          curl -L -o openwrt-ipk2apk.py https://raw.githubusercontent.com/rychly/openwrt-ipk2apk/main/openwrt-ipk2apk.py
          chmod +x openwrt-ipk2apk.py

      # 自动获取 iStore 最新 IPK 链接并下载
      - name: Fetch latest iStore IPK packages
        run: |
          set -e
          BASE_URL="https://istore.linkease.com/repo/all/store/"
          
          # 定义需要下载的包名（前缀匹配）
          declare -A PKG_PREFIXES=(
            ["taskd"]="taskd_"
            ["luci-lib-taskd"]="luci-lib-taskd_"
            ["luci-lib-xterm"]="luci-lib-xterm_"
            ["luci-app-store"]="luci-app-store_"
          )
          
          mkdir -p istore_ipks
          
          # 获取页面索引，提取所有 .ipk 文件名
          echo "正在获取官方源文件列表..."
          curl -s "$BASE_URL" | grep -oE 'href="[^"]+\.ipk"' | sed 's/href="//;s/"//' > ipk_list.txt
          
          for pkg in "${!PKG_PREFIXES[@]}"; do
            prefix="${PKG_PREFIXES[$pkg]}"
            # 找出匹配前缀的最新版本（按版本号排序，取最后一个）
            latest=$(grep "^${prefix}" ipk_list.txt | sort -V | tail -n1)
            if [ -z "$latest" ]; then
              echo "错误：未找到匹配前缀 '$prefix' 的 IPK 文件"
              exit 1
            fi
            echo "下载 $pkg -> $latest"
            curl -L -o "istore_ipks/${pkg}.ipk" "${BASE_URL}${latest}"
            
            # 验证下载的文件是否为有效的 gzip 压缩包
            if ! file "istore_ipks/${pkg}.ipk" | grep -q "gzip compressed data"; then
              echo "错误：下载的文件无效（不是 gzip 格式），请检查链接：${BASE_URL}${latest}"
              exit 1
            fi
            echo "✓ $pkg 下载并验证通过"
          done

      # 可选：支持手动输入自定义 IPK URL
      - name: Download custom IPK from URL (if provided)
        if: github.event.inputs.custom_ipk_url != ''
        run: |
          mkdir -p custom_ipks
          curl -L -o custom_ipks/custom.ipk "${{ github.event.inputs.custom_ipk_url }}"
          if ! file "custom_ipks/custom.ipk" | grep -q "gzip compressed data"; then
            echo "警告：自定义 IPK 不是有效的 gzip 文件"
          fi

      # 转换所有 IPK 为 APK
      - name: Convert IPKs to APKs
        run: |
          mkdir -p apk_output
          
          # 转换 istore_ipks 中的文件
          for ipk in istore_ipks/*.ipk; do
            if [ -f "$ipk" ]; then
              echo "正在转换: $ipk"
              ./openwrt-ipk2apk.py "$ipk"
              # 移动生成的 APK（脚本会在同目录生成 .apk）
              base="${ipk%.ipk}"
              if [ -f "${base}.apk" ]; then
                mv "${base}.apk" apk_output/
              else
                echo "警告：未生成 APK 文件，请检查转换日志"
              fi
            fi
          done
          
          # 转换自定义 IPK
          if [ -d "custom_ipks" ]; then
            for ipk in custom_ipks/*.ipk; do
              if [ -f "$ipk" ]; then
                echo "正在转换自定义: $ipk"
                ./openwrt-ipk2apk.py "$ipk"
                base="${ipk%.ipk}"
                if [ -f "${base}.apk" ]; then
                  mv "${base}.apk" apk_output/
                fi
              fi
            done
          fi

      # 将生成的 APK 复制到仓库根目录下的 apk/ 文件夹
      - name: Prepare APK directory
        run: |
          mkdir -p apk
          cp apk_output/*.apk apk/

      # 提交并推送 APK 到当前分支的 /apk 目录
      - name: Commit and push APKs to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          # 添加 apk 目录的所有变更（新增、修改、删除）
          git add apk/
          
          # 检查是否有实际变更
          if git diff --cached --quiet; then
            echo "没有检测到 APK 变更，跳过提交"
          else
            git commit -m "Update APK packages from workflow run #${{ github.run_id }} [skip ci]"
            # 拉取远程最新变更并 rebase，避免推送冲突
            git pull --rebase --autostash origin ${{ github.ref_name }} || true
            # 推送到当前分支
            git push origin HEAD:${{ github.ref_name }}
          fi
