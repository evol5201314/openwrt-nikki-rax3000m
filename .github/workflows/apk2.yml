name: apk2

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (默认 aarch64_cortex-a53)'
        required: false
        default: 'aarch64_cortex-a53'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3 unzip libssl-dev libncurses5-dev file
          # 确保 sed 可用（系统自带，但这里检查）
          which sed

      - name: 克隆 OpenWrt 25.12 源码
        run: |
          git clone --depth 1 --branch v25.12.0 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 添加 iStore feed
        run: |
          cd openwrt
          echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置（启用 iStore 及必要内核模块）
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y
          CONFIG_APK=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-istore=y
          CONFIG_PACKAGE_istore=y
          CONFIG_PACKAGE_istore-sync=y
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          EOF
          make defconfig

      - name: 下载源码
        run: cd openwrt && make download -j8

      # 新增：编译基础工具链（tools 和 toolchain），确保 sed 等 host 工具可用
      - name: 编译基础工具链
        run: |
          cd openwrt
          # 只编译 tools 和 toolchain，不编译整个固件
          make tools/install -j$(nproc)
          make toolchain/install -j$(nproc)

      - name: 编译内核模块
        run: |
          cd openwrt
          make target/linux/compile -j$(nproc) || true

      - name: 编译 iStore 插件
        run: |
          cd openwrt
          # 再次安装 feeds 确保
          ./scripts/feeds install -a
          # 尝试编译 luci-app-store
          make package/feeds/istore/luci-app-store/compile -j1 V=s || \
          make package/feeds/istore/luci-app-istore/compile -j1 V=s || \
          make package/feeds/istore/istore/compile -j1 V=s

      - name: 收集所有 APK
        run: |
          mkdir apks
          find openwrt/bin -name "*.apk" -exec cp {} apks/ \;
          cd apks
          ls -la
          tar -czvf ../istore-with-kmod-${{ inputs.arch }}.tar.gz .
          echo "FILE=$GITHUB_WORKSPACE/istore-with-kmod-${{ inputs.arch }}.tar.gz" >> $GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: istore-apk-${{ github.run_number }}
          name: "iStore APK 包 (含内核模块)"
          files: ${{ env.FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
