name: apk2

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: 检查分支
        uses: actions/checkout@v6

      - name: 释放磁盘空间
        run: |
          sudo rm -rf /etc/apt/sources.list.d
          sudo swapoff -a
          sudo rm -f /swapfile /mnt/swapfile
          sudo docker prune -a -f
          sudo systemctl stop docker
          sudo apt-get -y purge firefox clang* ghc* google* llvm* mono* mongo* mysql* php*
          sudo apt-get -y autoremove --purge
          sudo apt-get clean
          df -Th

      - name: 编译环境
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo apt-get install -y tar build-essential flex bison cmake g++ gawk gcc-multilib g++-multilib gettext git libfuse-dev libncurses5-dev libssl-dev python3 python3-pip python3-ply python3-distutils python3-pyelftools rsync unzip zlib1g-dev file wget subversion patch upx-ucl autoconf automake curl asciidoc binutils bzip2 lib32gcc-s1 libc6-dev-i386 uglifyjs msmtp texinfo libreadline-dev libglib2.0-dev xmlto libelf-dev libtool autopoint antlr3 gperf ccache swig coreutils haveged scons libpython3-dev rename qemu-utils
          sudo apt-get clean
          git config --global user.name 'GitHub Actions' && git config --global email 'noreply@github.com'
          sudo timedatectl set-timezone Asia/Shanghai
          sudo mkdir -p /workdir
          sudo chown $USER:$GROUPS /workdir
          df -Th

      - name: 设置环境变量
        run: |
          echo "REPO_URL=https://github.com/shiyu1314/openwrt-source" >> $GITHUB_ENV
          echo "DEVICE=cmcc_rax3000m-emmc" >> $GITHUB_ENV

      - name: 克隆源代码
        working-directory: /workdir
        run: |
          git clone $REPO_URL openwrt
          ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

      - name: 切换分支
        run: |
          cd openwrt
          _release_tag=$(git tag --sort=taggerdate --list 'v25.*' | tail -1)
          git checkout $_release_tag

      - name: 添加 iStore & Passwall 源
        run: |
          cd openwrt
          echo "src-git istore https://github.com/linkease/istore" >> feeds.conf.default
          echo "src-git passwall https://github.com/xiaorouji/openwrt-passwall-packages" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2" >> feeds.conf.default

      - name: 更新 feeds
        run: |
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 加载配置
        run: |
          cd openwrt
          cat >> .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_$DEVICE=y
          CONFIG_PACKAGE_luci-app-store=y
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_hysteria=y
          CONFIG_PACKAGE_trojan-plus=y
          CONFIG_PACKAGE_sing-box=y
          EOF

      - name: 下载编译依赖
        run: |
          cd openwrt
          make defconfig
          make download -j8

      - name: 编译源码
        run: |
          cd openwrt
          make -j$(nproc) || make -j1 V=s

      - name: 上传固件
        uses: actions/upload-artifact@v4
        with:
          name: openwrt-25.12-istore-passwall2
          path: openwrt/bin/targets/mediatek/filogic/*

      # ==================== 【最终修复】上传 插件 + 内核包 + 全部依赖 ====================
      - name: 上传完整插件包(含内核)到 Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          name: OpenWrt 25.12 完整插件包(APK+内核)
          tag_name: ${{ github.run_id }}
          files: |
            openwrt/bin/packages/aarch64_cortex-a53/**/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
