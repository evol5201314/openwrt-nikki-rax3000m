name: apk2

on:
  workflow_dispatch:
    inputs:
      arch:
        description: '目标架构 (默认 aarch64_cortex-a53)'
        required: false
        default: 'aarch64_cortex-a53'

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: 安装依赖
        run: |
          sudo apt update
          sudo apt install -y build-essential git python3 unzip libssl-dev libncurses5-dev file

      - name: 克隆 OpenWrt 25.12 源码
        run: |
          git clone --depth 1 --branch v25.12.0 https://github.com/openwrt/openwrt.git
          cd openwrt
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 添加 iStore 和 PassWall2 feeds
        run: |
          cd openwrt
          echo "src-git istore https://github.com/linkease/istore.git;main" >> feeds.conf.default
          echo "src-git passwall2 https://github.com/xiaorouji/openwrt-passwall2.git" >> feeds.conf.default
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 配置（启用插件及依赖的内核模块）
        run: |
          cd openwrt
          cat > .config <<EOF
          CONFIG_TARGET_mediatek=y
          CONFIG_TARGET_mediatek_filogic=y
          CONFIG_TARGET_mediatek_filogic_DEVICE_cmcc_rax3000m-emmc=y
          CONFIG_APK=y
          # iStore 组件
          CONFIG_PACKAGE_istore=y
          CONFIG_PACKAGE_luci-app-istore=y
          # PassWall2 组件
          CONFIG_PACKAGE_luci-app-passwall2=y
          CONFIG_PACKAGE_passwall2=y
          CONFIG_PACKAGE_xray-core=y
          CONFIG_PACKAGE_v2ray-geoip=y
          CONFIG_PACKAGE_v2ray-geosite=y
          # 内核模块（PassWall2 常用依赖）
          CONFIG_PACKAGE_kmod-tun=y
          CONFIG_PACKAGE_kmod-inet-diag=y
          CONFIG_PACKAGE_kmod-nft-tproxy=y
          CONFIG_PACKAGE_kmod-ipt-nat=y
          EOF
          make defconfig

      - name: 下载源码
        run: cd openwrt && make download -j8

      - name: 编译内核模块
        run: |
          cd openwrt
          # 编译内核模块（生成 kmod-*.apk）
          make target/linux/compile -j$(nproc)

      - name: 编译插件
        run: |
          cd openwrt
          make package/istore/compile -j$(nproc)
          make package/luci-app-istore/compile -j$(nproc)
          make package/luci-app-passwall2/compile -j$(nproc)
          make package/xray-core/compile -j$(nproc)

      - name: 收集所有 APK（包括内核模块）
        run: |
          mkdir apks
          # 查找所有 .apk 文件（插件 + 内核模块 + 依赖）
          find openwrt/bin -name "*.apk" -exec cp {} apks/ \;
          cd apks
          # 列出内容以便确认
          ls -la
          tar -czvf ../istore-passwall2-with-kmod-${{ inputs.arch }}.tar.gz .
          echo "FILE=$GITHUB_WORKSPACE/istore-passwall2-with-kmod-${{ inputs.arch }}.tar.gz" >> $GITHUB_ENV

      - name: 上传到 Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: apk-with-kmod-${{ github.run_number }}
          name: "iStore+PassWall2 APK 包 (含内核模块)"
          files: ${{ env.FILE }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
